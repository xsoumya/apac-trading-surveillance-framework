[project]
name = "apac-trading-surveillance-framework"
version = "0.1.0"
description = "A starter framework for APAC trading surveillance and compliance oversight tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "plotly>=5.18.0",
  "dash>=2.14.0",
  "sqlalchemy>=2.0.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "pytest>=7.0.0",
  "jupyter>=1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
